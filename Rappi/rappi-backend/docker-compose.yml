services:

  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: rappi-postgres
    environment:
      POSTGRES_USER: rappi
      POSTGRES_PASSWORD: rappi123
      POSTGRES_DB: rappi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7
    container_name: rappi-redis
    ports:
      - "6379:6379"

  # ── Zookeeper (required by Kafka) ───────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rappi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # ── Kafka ───────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rappi-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ── Kafka UI (so you can see your topics visually) ──
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rappi-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  postgres_data: